[project]
name = "synteny-pipeline"
version = "0.1.0"
description = "Comparative SLRP analyses and an NCBI-based synteny pipeline"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7.0",
  "pandas>=2.0.0",
  "pydantic>=2.0.0",
  "pyfaidx>=0.8.0",
  "pyyaml>=6.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = ["ruff>=0.16,<0.17"]

[project.scripts]
synteny = "synteny_pipeline.ui.cli:app"

[tool.ruff]
exclude = ["archive", "data", "runs", "thesis/build"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
ignore = ["B008", "B904"]
